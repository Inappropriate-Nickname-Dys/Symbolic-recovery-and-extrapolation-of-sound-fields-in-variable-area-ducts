[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-technique"
version = "0.1.0"
description = "Symbolic recovery and extrapolation of Webster duct sound fields"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10,<2", "sympy>=1.12,<2"]

[project.optional-dependencies]
regression = ["pysr==1.5.9", "torch>=2.0,<2.5"]
analysis = ["matplotlib>=3.8,<3.9", "pandas>=2,<3", "torch>=2.0,<2.5"]
dev = ["black==24.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]
