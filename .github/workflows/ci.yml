name: Scientific unit checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 scipy==1.11.4 sympy==1.12
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python reproduce.py --help
